<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAAD MEDIA | رشد برند، اتفاقی نیست</title>
<style>
@font-face{font-family:'ZaadFont';src:url('ZaadFont.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'ZaadFont',system-ui,sans-serif;background:#060B1F;color:#E6ECFF;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
ul{list-style:none}
:root{--bg:#060B1F;--bg-2:#0A1128;--navy:#0B1437;--royal:#2E5BFF;--royal-2:#4B7BFF;--royal-deep:#1E3FBF;--white:#FFF;--text:#E6ECFF;--muted:#9AA6C7;--line:rgba(255,255,255,0.08);--glass:rgba(255,255,255,0.04);--glass-2:rgba(255,255,255,0.06);--radius:18px;--radius-lg:26px;--container:1200px;--ease:cubic-bezier(.2,.7,.2,1);--grad:linear-gradient(135deg,#4B7BFF 0%,#2E5BFF 50%,#1E3FBF 100%)}
.container{width:100%;max-width:var(--container);margin:0 auto;padding:0 24px}
section{position:relative;padding:120px 0}
@media(max-width:768px){section{padding:80px 0}}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:2px;color:var(--royal-2);text-transform:uppercase;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px)}
.section-head{text-align:center;margin-bottom:64px}
.section-title{font-size:clamp(28px,4vw,44px);font-weight:800;margin-top:18px;line-height:1.3;color:var(--white)}
.gradient-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border-radius:999px;font-weight:700;font-size:15px;transition:all .35s var(--ease);position:relative;white-space:nowrap;overflow:hidden;cursor:pointer}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 30px rgba(46,91,255,0.35),inset 0 1px 0 rgba(255,255,255,0.2)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 45px rgba(46,91,255,0.55)}
.btn-ghost{background:var(--glass);color:var(--white);border:1px solid var(--line);backdrop-filter:blur(10px)}
.btn-ghost:hover{background:var(--glass-2);border-color:var(--royal-2)}
.btn-lg{padding:18px 38px;font-size:16px}
.site-header{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 0;transition:all .4s var(--ease)}
.site-header.scrolled{padding:12px 0;background:rgba(6,11,31,0.85);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--white)}
.logo-mark{width:36px;height:36px;display:grid;place-items:center;background:var(--grad);border-radius:10px;color:#fff;font-weight:900;box-shadow:0 8px 24px rgba(46,91,255,0.4)}
.logo-light{color:var(--muted);font-weight:500}
.nav{display:flex;gap:6px}
.nav-link{padding:10px 16px;font-size:14px;color:var(--text);border-radius:999px;transition:all .3s var(--ease)}
.nav-link:hover{color:var(--white);background:var(--glass)}
.header-cta{padding:10px 22px;font-size:14px}
.menu-toggle{display:none;width:42px;height:42px;flex-direction:column;justify-content:center;align-items:center;gap:5px;border-radius:10px;background:var(--glass);border:1px solid var(--line)}
.menu-toggle span{width:20px;height:2px;background:var(--white);transition:all .3s var(--ease);border-radius:2px}
.menu-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-toggle.open span:nth-child(2){opacity:0}
.menu-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:960px){.nav,.header-cta{display:none}.menu-toggle{display:flex}.nav.open{display:flex;position:absolute;top:100%;left:16px;right:16px;flex-direction:column;background:rgba(11,20,55,0.95);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;padding:12px;gap:4px}.nav.open .nav-link{padding:14px 18px}}
.hero{min-height:100vh;display:flex;align-items:center;padding:140px 0 100px;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(1000px 600px at 80% -10%,rgba(46,91,255,0.25),transparent 60%),radial-gradient(800px 500px at 10% 30%,rgba(30,63,191,0.2),transparent 60%),linear-gradient(180deg,#060B1F 0%,#0A1128 100%)}
.grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,black 40%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,black 40%,transparent 80%)}
.glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.6;animation:float 12s ease-in-out infinite}
.glow-1{width:500px;height:500px;background:#2E5BFF;top:-100px;right:-100px}
.glow-2{width:400px;height:400px;background:#1E3FBF;bottom:-100px;left:-100px;animation-delay:-4s}
.glow-3{width:300px;height:300px;background:#4B7BFF;top:40%;left:40%;opacity:0.3;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.1)}}
.hero-inner{position:relative;z-index:1;text-align:center;max-width:900px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);font-size:13px;color:var(--text);margin-bottom:28px}
.dot{width:8px;height:8px;border-radius:50%;background:#4BFF9B;box-shadow:0 0 12px #4BFF9B;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.hero-title{font-size:clamp(38px,6vw,72px);font-weight:900;line-height:1.15;color:var(--white);letter-spacing:-0.5px}
.hero-sub{margin-top:24px;font-size:clamp(18px,2.2vw,24px);font-weight:6
